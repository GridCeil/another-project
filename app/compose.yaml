services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: unsaid
      POSTGRES_USER: unsaid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unsaid -d unsaid"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      DATABASE_URL: postgresql://unsaid:${POSTGRES_PASSWORD}@db:5432/unsaid
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
